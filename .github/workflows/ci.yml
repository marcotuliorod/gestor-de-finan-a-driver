name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend — Test (Python/FastAPI)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: driver_finance
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: driver_finance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U driver_finance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://driver_finance:devpassword@localhost:5432/driver_finance_test
      APP_DB_PASSWORD: app-test-password
      APP_DATABASE_URL: postgresql://driver_finance_app:app-test-password@localhost:5432/driver_finance_test
      JWT_SECRET: ci-test-secret
      GOOGLE_CLIENT_ID: ci-test-google-client-id
      APPLE_BUNDLE_ID: com.marcotuliorod.driver_finance
      ANTHROPIC_API_KEY: ci-test-anthropic-key

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest -q

  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Bootstrap platform directories
        run: flutter create . --org com.marcotuliorod --project-name driver_finance --platforms ios

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format code
        run: dart format lib/ test/

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Check coverage
        run: |
          sudo apt-get install -y lcov -q
          LINES=$(lcov --summary coverage/lcov.info 2>&1 | grep "lines" | awk '{print $2}' | tr -d '%')
          echo "Line coverage: ${LINES:-0}%"
          THRESHOLD=0
          if [ -n "$LINES" ] && awk "BEGIN{exit !($LINES < $THRESHOLD)}"; then
            echo "Coverage ${LINES}% is below the required ${THRESHOLD}%"
            exit 1
          fi

  build-android:
    name: Build Android APK (debug)
    runs-on: ubuntu-latest
    needs: [analyze-and-test, backend-test]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK (debug)
        run: |
          flutter build apk --debug \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }} \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
