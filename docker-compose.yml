services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: driver_finance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: driver_finance
    # Sem publicação de porta aqui de propósito — só o serviço `api` precisa
    # alcançar o Postgres, e faz isso pela rede interna do compose (host
    # `postgres`). Acesso administrativo (psql) deve ser via
    # `docker compose exec postgres psql ...`, nunca expondo 5432 ao host.
    # Dev local que queira `localhost:5432` direto ganha isso via
    # docker-compose.override.yml (carregado automaticamente por `up` sem -f).
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driver_finance"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Role admin/dona das tabelas — usada só para rodar as migrations.
      DATABASE_URL: postgresql://driver_finance:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/driver_finance
      # Role de baixo privilégio usada pelo pool de runtime da API — é o
      # que faz a RLS (isolamento por usuário) valer de verdade; ver
      # backend/migrations/0012_create_app_role.sql.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-dev-app-password-change-me}
      APP_DATABASE_URL: postgresql://driver_finance_app:${APP_DB_PASSWORD:-dev-app-password-change-me}@postgres:5432/driver_finance
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-com.marcotuliorod.driverFinance}
      # Chat IA (Claude Haiku) — nunca exposta ao Flutter, só usada aqui.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Wildcard é aceitável aqui: o único cliente é o app mobile (Flutter),
      # que não envia cabeçalho Origin como um browser — CORS não é uma
      # superfície de ataque real para uma API sem cliente web.
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    # Sem publicação de porta aqui de propósito — em produção só a Caddy
    # (docker-compose.prod.yml) deve falar com a API, pela rede interna do
    # compose (host `api`). Dev local ganha `localhost:8000` via
    # docker-compose.override.yml.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
