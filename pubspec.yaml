name: driver_finance
description: Gestão financeira para motoristas de aplicativos — Driver Finance AI
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^12.1.1

  # Local database — Offline First
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.3
  path: ^1.9.0

  # Backend próprio (auth + dados + IA) — ver ADR-0006
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2

  # Authentication
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1

  # Error handling (Either, Option)
  fpdart: ^1.1.0

  # Charts
  fl_chart: ^0.68.0

  # Formatting / i18n
  intl: ^0.19.0

  # Local preferences (onboarding state, theme)
  shared_preferences: ^2.3.0

  # CSV export + share
  csv: ^6.0.0
  share_plus: ^10.0.0

  # Local notifications (maintenance alerts, goal achievement)
  flutter_local_notifications: ^17.0.0

  # Observability
  sentry_flutter: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  # Code generation
  riverpod_generator: ^2.4.2
  build_runner: ^2.4.11
  drift_dev: ^2.18.0

  # Testing
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
